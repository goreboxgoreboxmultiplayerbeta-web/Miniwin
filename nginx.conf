server {
    listen __PORT__ default_server;
    server_name _;

    auth_basic "MiniWin - private desktop";
    auth_basic_user_file /etc/nginx/.miniwin-htpasswd;
    client_max_body_size 34m;

    # Render health endpoint does not require authentication.
    location = /health {
        auth_basic off;
        default_type text/plain;
        return 200 'ok';
    }

    location = / {
        root /opt/miniwin/www;
        try_files /index.html =404;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # The noVNC static site and its WebSocket connection share this proxy.
    location / {
        proxy_pass http://127.0.0.1:6080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
